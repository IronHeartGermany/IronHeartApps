[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hs-coo-codes"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "click>=8.5.0,<9",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pylint.main]
init-hook = "import sys; from pathlib import Path; sys.path.insert(0, str(Path('src').resolve()))"
